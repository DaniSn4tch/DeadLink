    <body class="mainbg">
        <audio id="bgAudio" autoplay loop preload="auto" muted playsinline style="display:none;">
            <source src="sounds/deadlink_bg_music.mp3" type="audio/mpeg">
        </audio>

        <script>
            const bgAudio = document.getElementById('bgAudio');

            function startMusic() {
                bgAudio.muted = false;
                bgAudio.play().catch(() => {});
            }

            window.addEventListener('pointerdown', startMusic, { once: true });
            window.addEventListener('keydown', startMusic, { once: true });
        </script>
        <header>
            <div class="header_image"></div>
            <div class="topnav">
                <a class="brand" href="index.html">DEADLINK</a>
                <div class="topnav-right">
                    <a class="headertext btn change" href="index.html#search">Archive</a>
                    <a class="headertext btn change" href="manifesto.html">Manifesto</a>
                </div>
            </div>
        </header>
        <main class="container">
            <section class="poem-intro" aria-label="Opening poem">
                <p class="poem-label">Wel[come]</p>
                <p class="poem">
                    <span>.[p]arse.[p]urse.strings.</span>
                    <span>.[d]e[v]oid.of.[h]uman.[e]ntry.</span>
                    <span>.[v]ector.[s]pace.[i]n.[f]lux.</span>
                    <span>.[c]ode.[w]ork.[e]xecuted.</span>
                </p>
            </section>
        
        </main>
    </body>
